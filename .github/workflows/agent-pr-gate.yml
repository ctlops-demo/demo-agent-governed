name: Agent PR Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  agent-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is agent-authored
        id: detect
        env:
          PR_AUTHOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          AGENT=false
          if [[ "$PR_AUTHOR" == *"[bot]" ]]; then AGENT=true; fi
          if [[ "$PR_BODY" == *"Generated by ControlOps"* ]]; then AGENT=true; fi
          if [[ "$PR_BODY" == *"ctlops:agent-authored"* ]]; then AGENT=true; fi
          echo "is_agent=$AGENT" >> "$GITHUB_OUTPUT"
      - name: Enforce agent PR policy
        if: steps.detect.outputs.is_agent == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "::notice::Agent-authored PR detected"
          if echo "$PR_BODY" | grep -qiE 'risk:\s*(high|critical)'; then
            echo "::error::High/critical risk agent PR requires additional review"
            exit 1
          fi
          echo "Agent PR gate passed (pending human review)"
      - name: Skip for human PRs
        if: steps.detect.outputs.is_agent != 'true'
        run: echo "Human-authored PR — agent gate not applicable"
